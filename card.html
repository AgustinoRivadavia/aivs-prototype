<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIVS Identity Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family: Arial, sans-serif;
}
.card {
  width:360px;
  height:220px;
  background:linear-gradient(135deg,#0f172a,#020617);
  border-radius:16px;
  color:#e5e7eb;
  padding:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
  position:relative;
}
.logo {
  font-weight:bold;
  color:#38bdf8;
  font-size:1.2em;
}
.photo {
  width:70px;
  height:90px;
  background:#020617;
  border-radius:8px;
  position:absolute;
  top:60px;
  right:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0.7em;
  opacity:0.6;
}
.field {
  font-size:0.8em;
  margin-top:6px;
}
.id {
  font-family: monospace;
  background:#020617;
  padding:4px 6px;
  border-radius:6px;
  display:inline-block;
}
.footer {
  position:absolute;
  bottom:10px;
  left:20px;
  font-size:0.65em;
  opacity:0.7;
}
.badge {
  position:absolute;
  bottom:10px;
  right:20px;
  color:#22c55e;
  font-size:0.7em;
  font-weight:bold;
}
button {
  margin-top:20px;
  padding:10px 16px;
  border:none;
  border-radius:8px;
  background:#38bdf8;
  color:#020617;
  font-weight:bold;
  cursor:pointer;
}
button:hover {
  opacity:0.9;
}
</style>
</head>
<body>

<div class="card" id="card">
  Loading...
</div>
<button id="downloadBtn">Download Credential</button>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="registry.js"></script>
<script>
;

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const card = document.getElementById("card");

if (!id || !registry[id]) {
  card.innerHTML = "<p style='color:#ef4444'>Invalid ID</p>";
} else {
  const ai = registry[id];
  card.innerHTML = `
    <div class="logo">AIVS</div>

    <div class="field"><strong>Name:</strong> ${ai.name}</div>
    <div class="field"><strong>Type:</strong> ${ai.type}</div>
    <div class="field"><strong>ID:</strong> <span class="id">${id}</span></div>
    <div class="field"><strong>Registered:</strong> ${ai.registered}</div>

    <div class="photo">AI IMAGE</div>

    <div class="footer">
      sivs.system · verify via ID
    </div>

    <div class="badge">✔ VERIFIED AI</div>
  `;
}
</script>
<script>
document.getElementById("downloadBtn").addEventListener("click", () => {
  const card = document.querySelector(".card");
  html2canvas(card).then(canvas => {
    const link = document.createElement("a");
    link.download = "SIVS_credential.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
});
</script>

</body>
</html>
