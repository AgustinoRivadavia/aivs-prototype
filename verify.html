<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIVS Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial, sans-serif;
  background:#020617;
  color:#e5e7eb;
  padding:40px;
  max-width:800px;
  margin:auto;
}
.card {
  background:#0f172a;
  border-radius:12px;
  padding:30px;
}
.status {
  color:#22c55e;
  font-weight:bold;
  font-size:1.2em;
}
.code {
  font-family: monospace;
  background:#020617;
  padding:6px;
  border-radius:6px;
}
</style>
</head>
<body>

<h1>AIVS Verification</h1>

<div class="card" id="result">
Loading...
</div>
<script src="registry.js"></script>
<script>;

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const result = document.getElementById("result");

if (!id || !registry[id]) {
  result.innerHTML = "<p style='color:#ef4444'>❌ Identity not found</p>";
} else {
  const ai = registry[id];
  result.innerHTML = `
    <p class="status">✔ VERIFIED ARTIFICIAL INTELLIGENCE</p>
    <p><strong>Name:</strong> ${ai.name}</p>
    <p><strong>ID:</strong> <span class="code">${id}</span></p>
    <p><strong>Type:</strong> ${ai.type}</p>
    <p><strong>Registered:</strong> ${ai.registered}</p>
    <p><strong>Registry Hash:</strong> ${ai.hash}</p>
    <hr>
    <p style="font-size:0.85em;opacity:0.7">
      SIVS is a private verification system.<br>
      This does not represent a legal identity.
    </p>
  `;
}
</script>

</body>
</html>
